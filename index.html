<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11131a" media="(prefers-color-scheme: dark)">
  <!-- 只允許實際會用到的來源。blob: 給 AudioWorklet 模組、vosk-browser 的 worker 與
       本機 ZIP 模型；wasm-unsafe-eval 給 sherpa / onnxruntime 的 WebAssembly 編譯。
       'unsafe-inline' 是本頁兩段內嵌 script 所需（沒有外部注入點，逐字稿一律走 textContent）；
       'unsafe-eval' 則是 vosk-browser 的 worker 會 eval（實測拿掉後模型永遠載不進去），
       emscripten 系的程式碼也常有此需求。CSP 在這裡主要還是擋「來源」，
       讓被換掉的 CDN 檔案無法注入執行。 -->
  <!-- CSP 註記：sherpa 的膠水層（sherpa-onnx-asr.js、sherpa-onnx-wasm-main-asr.js）
       是用 script 標籤從 Hugging Face 載入的，所以 script-src 必須允許 HF；只寫在
       connect-src 不夠 —— 實測預設資產位置會被 CSP 直接擋掉、sherpa 完全載不起來
       （Load failed: Script load failed）。hf.co 是 .wasm/.data 實際的 CDN 主機。 -->
  <!-- CSP 註記（Google Analytics）：原本的 CSP 沒有放行 gtag.js，**實測它被自己的 CSP
       擋掉**（securitypolicyviolation：script-src-elem、transferSize 0），也就是頁面上的
       GA 追蹤碼等於沒在跑。現在只放行 GA 真正會用到的三個來源：
         script-src   www.googletagmanager.com   —— gtag.js 本體
         connect-src  *.google-analytics.com     —— GA4 的 /g/collect beacon
                      *.analytics.google.com     —— GA 後台網域（部分地區走這裡）
         img-src      *.google-analytics.com     —— 不能用 sendBeacon／fetch 時的 pixel 退路
       其餘指令沒有放寬（object-src 仍是 none，也沒有開放任意第三方來源）。 -->
  <!-- CSP 註記（onnxruntime-web）：Underdog Bark 3.0 的 worker 會 import jsdelivr 上的
       ort.wasm.min.mjs，而它初始化 WASM 時會再從「自己的模組網址」開一個 proxy worker。
       那一步受 worker-src 管，只放行 script-src 不夠 —— 實測 worker 直接建不起來
       （onerror、訊息為空、log 顯示違反 worker-src）。jsdelivr 本來就在 script-src 內，
       所以這裡沒有放寬到新的來源。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://www.googletagmanager.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://*.google-analytics.com https://*.analytics.google.com;
    connect-src 'self' blob: data: https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://*.hf.space https://*.google-analytics.com https://*.analytics.google.com;
    worker-src 'self' blob: https://cdn.jsdelivr.net;
    child-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none'">
  <meta name="description" content="七引擎語音轉文字：即時辨識、MOSS 會議轉寫與 SRT 字幕輸出">
  <!-- 第一次下載模型或引擎前先建好連線：DNS + TCP + TLS 在手機上要 200–400 ms，
       而 HF 的 resolve 還會再 302 到 CDN（等於付兩次）。代價只有一次閒置連線。 -->
  <link rel="preconnect" href="https://huggingface.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="語音轉文字">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title id="pageTitle">多國語言即時逐字稿工具</title>
  <style>
    /* ==================== 版面原則（2026-10 UI 重構）====================
       會場裡眼睛只該看兩樣東西：逐字稿與「開始／停止」。所以
         * 桌機：左邊是固定在視窗內的「舞台」（狀態 → 逐字稿＋字幕條 → 操作列），
           右邊是可捲動的設定欄；捲設定時逐字稿不會被捲走。
         * 手機：舞台在上、設定在下，操作列黏在畫面底部，拇指隨時按得到。
       顏色全部走 token，深色模式（暗的會議室）只是換一組值。
       app.js 依賴的 id 與 class（.visible / .done / .listening / .active / .over …）一律不改名。 */
    :root {
      --bg: #f5f6fa; --surface: #fff; --surface-2: #f0f2f7; --text: #1b1e27; --muted: #5f6475;
      --border: #e1e4ec; --accent: #4652d6; --accent-hover: #3742c0; --accent-weak: #eceefe;
      --on-accent: #fff; --success: #0f7a5a; --success-weak: #e3f5ee; --danger: #c93a4a;
      --danger-weak: #fdecee; --warn-weak: #fff4d6; --warn-text: #6b4d00;
      --shadow: 0 1px 2px #1b1e270d, 0 8px 24px #1b1e2712; --radius: 14px;
      --sub-bg: #12141c; --sub-text: #fff; --sub-muted: #b9bdd3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11131a; --surface: #1a1d26; --surface-2: #222632; --text: #e6e8ef; --muted: #9da3b5;
        --border: #2d3240; --accent: #7c86ff; --accent-hover: #929bff; --accent-weak: #262a48;
        --on-accent: #0d0f1a; --success: #4cc79a; --success-weak: #173329; --danger: #ff6b7a;
        --danger-weak: #3a1d23; --warn-weak: #3a3114; --warn-text: #f5d67a;
        --shadow: 0 1px 2px #0006, 0 8px 24px #0005; --sub-bg: #07080c;
      }
    }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100% }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", Arial, sans-serif;
    }
    button, select, input { font: inherit; color: inherit }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
    a { color: var(--accent) }

    /* ── 頂列 ── */
    .appbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
      padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 }
    .brand img { width: 30px; height: 30px; border-radius: 8px; flex: none }
    h1 { margin: 0; font-size: 17px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    #uiLangToggle {
      flex: none; padding: 7px 14px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 650;
    }
    #uiLangToggle:hover { border-color: var(--accent) }

    /* ── 兩欄 ── */
    .layout {
      display: grid; gap: 20px; margin: 0 auto; max-width: 1440px;
      padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
      grid-template-columns: minmax(0, 1fr);
    }
    .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
    .sidebar { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
    @media (min-width: 1100px) {
      .layout { grid-template-columns: minmax(0, 1fr) 420px; align-items: start }
      .stage { position: sticky; top: 68px; height: calc(100vh - 84px) }
    }

    /* ── 狀態 ── */
    .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
    .status-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    }
    .status-label { font-size: 11.5px; color: var(--muted); font-weight: 600 }
    .status-value { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    #statusStateValue::before {
      content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%;
      background: var(--muted); vertical-align: 1px;
    }
    body:has(#controlBtn.listening) #statusStateValue { color: var(--danger) }
    body:has(#controlBtn.listening) #statusStateValue::before { background: var(--danger); animation: pulse 1.4s infinite }
    @keyframes pulse { 50% { opacity: .25 } }

    .load-bar {
      display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px;
      background: var(--accent-weak); border: 1px solid var(--border); border-radius: 10px;
    }
    .load-bar-text { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere }
    #topLoadBtn { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
    #topLoadBtn:disabled { opacity: .6; cursor: progress }

    /* ── 逐字稿 ＋ 字幕條 ── */
    .transcript-card {
      flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); transition: border-color .2s;
    }
    body:has(#controlBtn.listening) .transcript-card { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)) }
    .transcript-container {
      flex: 1; height: 52vh; min-height: 260px; overflow: auto; padding: 18px 20px;
      scroll-behavior: smooth; overscroll-behavior: contain;
    }
    @media (min-width: 1100px) { .transcript-container { height: auto; min-height: 0 } }
    #transcript {
      margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
      font: 17px/1.85 "Noto Sans TC", "PingFang TC", "Segoe UI", sans-serif;
    }
    .placeholder { color: var(--muted) }
    .interim { color: var(--muted); font-style: italic }
    .subtitle-bar {
      display: grid; gap: 2px; padding: 12px 20px 14px; background: var(--sub-bg); color: var(--sub-text);
    }
    .subtitle-zh { font-size: var(--sub-zh, 30px); font-weight: 800; line-height: 1.35; letter-spacing: .01em }
    .subtitle-en { font-size: calc(var(--sub-zh, 30px) * 0.55); line-height: 1.4; color: var(--sub-muted) }
    .subtitle-en:empty { display: none }
    body[data-sub-scale="s"] { --sub-zh: 20px }
    body[data-sub-scale="m"] { --sub-zh: 30px }
    body[data-sub-scale="l"] { --sub-zh: 44px }
    /* 浮動字幕窗（Document PiP）：同一份樣式被複製到另一個 document，字級靠 --sub-zh */
    body.subtitle-pip-mode { background: var(--sub-bg); min-height: 0 }
    body.subtitle-pip-mode .subtitle-bar { height: 100vh; align-content: center; padding: 12px 24px }
    body.subtitle-pip-mode .subtitle-zh { font-size: var(--sub-zh, 34px) }

    /* ── 操作列 ── */
    .controls {
      display: grid; grid-template-columns: auto minmax(80px, 1fr) auto auto auto; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
    }
    .meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden }
    .meter>div {
      height: 100%; transform: scaleX(0); transform-origin: left; transition: transform .08s;
      background: linear-gradient(90deg, #2fb67a, #d6c93a, #ef5a5a);
    }
    button.action {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 16px; min-height: 40px;
      background: var(--surface); font-weight: 650; cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s, transform .1s, filter .15s;
    }
    button.action:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-weak) }
    button.action:active:not(:disabled) { transform: scale(.97) }
    button:disabled { opacity: .45; cursor: not-allowed }
    #controlBtn {
      min-width: 168px; min-height: 48px; padding: 10px 22px; font-size: 16px; font-weight: 750;
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    }
    #controlBtn::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor }
    #controlBtn:hover:not(:disabled) { background: var(--accent-hover) }
    #controlBtn.listening { background: var(--danger); border-color: var(--danger) }
    #controlBtn.listening::before { border-radius: 2px }
    #clearBtn:hover:not(:disabled) { border-color: var(--danger); background: var(--danger-weak); color: var(--danger) }
    /* 模型面板：載入＝主色實心，已載入＝綠色＋勾勾，清快取＝紅色外框 */
    #loadVoskBtn, #loadSherpaBtn, #loadWhisperBtn, #loadWhistleBtn, #loadUnderdogBtn, #mossRunBtn {
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    }
    #loadVoskBtn:hover:not(:disabled), #loadSherpaBtn:hover:not(:disabled), #loadWhisperBtn:hover:not(:disabled),
    #loadWhistleBtn:hover:not(:disabled), #loadUnderdogBtn:hover:not(:disabled), #mossRunBtn:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button.action.done, button.action.done:hover:not(:disabled) {
      background: var(--success-weak); border-color: var(--success); color: var(--success);
    }
    #clearSherpaCacheBtn, #clearWhistleCacheBtn, #clearUnderdogCacheBtn { color: var(--danger) }
    #clearSherpaCacheBtn:hover:not(:disabled), #clearWhistleCacheBtn:hover:not(:disabled),
    #clearUnderdogCacheBtn:hover:not(:disabled) { border-color: var(--danger); background: var(--danger-weak) }

    /* ── 設定欄 ── */
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    }
    .panel-label { display: block; font-size: 13px; font-weight: 750; color: var(--muted); margin: 0 0 10px }
    label { font-weight: 650; font-size: 14px }
    .engine-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 14px }
    .engine-card {
      display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; cursor: pointer;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 11px; padding: 10px 12px;
      transition: border-color .15s, background .15s;
    }
    .engine-card:hover:not(:disabled) { border-color: var(--accent) }
    .engine-card.active { border-color: var(--accent); background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent) }
    .ecard-top { display: flex; justify-content: space-between; align-items: center; gap: 6px }
    .ecard-name { font-weight: 750; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere }
    .ecard-tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap }
    .ecard-tag.local { background: var(--success-weak); color: var(--success) }
    .ecard-tag.cloud { background: var(--warn-weak); color: var(--warn-text) }
    .ecard-desc { font-size: 12px; color: var(--muted); line-height: 1.4 }
    .field { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
    .field label { min-width: 84px }
    select, input[type=url], input[type=text] {
      flex: 1 1 180px; min-width: 0; padding: 8px 10px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2);
    }
    input[type=file] { flex: 1 1 180px; min-width: 0; font-size: 13px }
    select:hover, input[type=url]:hover, input[type=text]:hover { border-color: var(--muted) }
    .lang-note { flex-basis: 100%; font-size: 12.5px; color: var(--muted) }
    .quickstart {
      margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6;
      background: var(--accent-weak); border-left: 3px solid var(--accent);
    }
    .quickstart b { color: var(--accent) }
    .quickstart code, .hint code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .92em }
    .engine-config { display: none }
    .engine-config.visible { display: block }
    .row { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px }
    .row:last-child { margin-bottom: 0 }
    .row > label:first-child { min-width: 84px }
    .hint { font-size: 12.5px; line-height: 1.6; color: var(--muted); margin: 12px 0 0 }
    .hint b { color: var(--text) }
    input[type=checkbox] {
      appearance: none; flex: none; width: 38px; height: 22px; margin: 0; border-radius: 999px; cursor: pointer;
      background: var(--border); position: relative; transition: background .15s;
    }
    input[type=checkbox]::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px #0004; transition: transform .15s;
    }
    input[type=checkbox]:checked { background: var(--accent) }
    input[type=checkbox]:checked::after { transform: translateX(16px) }
    .moss-filezone {
      position: relative; flex: 1 1 200px; min-height: 64px; display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--border); border-radius: 10px; background: var(--surface-2); cursor: pointer; padding: 8px;
    }
    .moss-filezone:hover, .moss-filezone.over { border-color: var(--accent); background: var(--accent-weak) }
    .moss-filezone input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer }
    .moss-filetext { font-size: 13px; font-weight: 650; text-align: center; pointer-events: none; overflow-wrap: anywhere }
    .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 12px; display: none }
    .progress.visible { display: block }
    .progress>div { height: 100%; width: 0; background: var(--accent); transition: width .2s }
    .progress>div.indeterminate { width: 32%; animation: loading 1.2s infinite }
    @keyframes loading { from { transform: translateX(-120%) } to { transform: translateX(320%) } }
    .model-status { min-height: 20px; font-size: 13px; margin-top: 6px; color: var(--muted); overflow-wrap: anywhere }
    .model-status:empty { min-height: 0; margin: 0 }
    .error { color: var(--danger) }
    .success { color: var(--success) }
    .notice {
      padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.5;
      background: var(--warn-weak); color: var(--warn-text);
    }
    .notice.local { background: var(--success-weak); color: var(--success) }
    details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) }
    summary { padding: 12px 16px; cursor: pointer; font-weight: 700; font-size: 14px }
    .details-content { padding: 0 16px 16px; font-size: 13.5px; line-height: 1.65; color: var(--muted) }
    .details-content h3 { color: var(--text); font-size: 14px; margin: 14px 0 4px }
    .details-content ul { margin: 4px 0; padding-left: 20px }

    #toast {
      position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 18px); background: #1b1e27f2; color: #fff;
      padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
      transition: .25s; max-width: 90%; text-align: center; font-weight: 650; box-shadow: var(--shadow);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0) }
    /* 量測 HUD（Phase 0）：預設關閉，只有想看數字的人會開 */
    #metricsHud {
      position: fixed; right: 12px; bottom: 12px; z-index: 60;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0b0c13ee; color: #a8f0c6; padding: 8px 10px; border-radius: 8px;
      white-space: pre; pointer-events: none; max-width: 46vw;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 720px) {
      .layout { padding-top: 12px; gap: 14px }
      .status-grid { grid-template-columns: 1fr 1fr; gap: 6px }
      .status-card { padding: 6px 10px }
      /* 手機只留「狀態／引擎」：執行環境是給除錯看的，隱私等級在設定欄的提示條裡已經有 */
      .status-card:nth-child(n+3) { display: none }
      .transcript-container { height: 48vh; padding: 14px 16px }
      #transcript { font-size: 16px }
      /* 開始／停止固定在畫面底部：捲到設定欄時也按得到，會場裡單手就能操作。
         （sticky 只在 .stage 範圍內有效，捲過舞台就會跟著離開，所以這裡用 fixed） */
      .layout { padding-bottom: calc(88px + env(safe-area-inset-bottom)) }
      .controls { grid-template-columns: repeat(3, minmax(0, 1fr)) }
      #controlBtn {
        position: fixed; z-index: 25; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
        min-height: 54px; box-shadow: 0 6px 20px #0003;
      }

<!-- Google tag (gtag.js) —— G-GHGBM401HN
     三件事要注意：
     1. 這裡**沒有 SRI**（其他外部程式都有）：Google 會持續更新這支檔案內容，綁 integrity
        會在某天直接讓 GA 停止載入，而且失敗是靜默的。安全邊界靠上面的 CSP 放行清單。
     2. 它需要 CSP 的 script-src 放行 www.googletagmanager.com、connect-src 放行
        *.google-analytics.com —— 少了任何一個，GA 就會被自己的 CSP 擋掉（實測踩過：
        securitypolicyviolation script-src-elem、transferSize 0，表面上「有裝 GA」但完全沒資料）。
     3. **刻意不在解析階段下載**：gtag.js 實測 181 KB（br），是 App 本體 gzip（44.6 KB）的
        4 倍，而且每個訪客每次進來都付。改成頁面 load 之後、瀏覽器閒置時才抓（最多等 3 秒）。
        取捨：page_view 會晚 1–3 秒送出，**極短命的工作階段（開了就關）可能漏記**。
        要恢復「一進來就載」，把最後的 scheduleAnalytics() 換成 loadAnalytics() 即可。
     本頁只送 gtag('config')，沒有自訂事件；逐字稿與音訊不會進 GA。 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GHGBM401HN');

  let gaLoaded = false;
  function loadAnalytics() {
    if (gaLoaded) return;
    gaLoaded = true;
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-GHGBM401HN';
    document.head.appendChild(script);
  }
  function scheduleAnalytics() {
    // Safari 舊版沒有 requestIdleCallback，退回固定 1.2 秒
    if ('requestIdleCallback' in window) requestIdleCallback(loadAnalytics, { timeout: 3000 });
    else setTimeout(loadAnalytics, 1200);
  }
  if (document.readyState === 'complete') scheduleAnalytics();
  else window.addEventListener('load', scheduleAnalytics, { once: true });
</script>
</head>

       只在段落確定後把內容送進這裡 -->
  <div id="a11yAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- OpenCC（簡→繁）不在這裡用 script 標籤載入，改由 ensureOpencc() 按需下載 ——
       原因見 opencc 常數旁的註解（它 1.04 MB，會擋住整個 App 的啟動）。 -->
  <script type="module" src="src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // 跨來源隔離的標頭由 sw.js 補：第一次造訪時頁面還沒被 SW 控制，拿不到。
      // SW 接手後重新整理一次 —— 只限「載入時沒有 controller」的第一次，
      // 之後 SW 更新（也會觸發 controllerchange）不重整，錄音中的頁面不會被打斷。
      const firstVisit = !navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (firstVisit && !self.crossOriginIsolated) location.reload();
      });
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
