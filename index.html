<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title id="pageTitle">多國語言即時逐字稿工具</title>
  <style>
    :root {
      --primary: #5668d8;
      --secondary: #7046a0;
      --success: #16856f;
      --danger: #d94f4f;
      --warning: #f4c542;
      --panel: rgba(255, 255, 255, .16);
      --border: rgba(255, 255, 255, .30);
      --shadow: 0 12px 36px rgba(20, 18, 60, .24);
    }
    * { box-sizing: border-box }
    html { scroll-behavior: smooth }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    }
    button, select, input { font: inherit }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid #ffe16b; outline-offset: 3px;
    }
    .topbar { width: min(100%, 960px); display: flex; justify-content: flex-end }
    #uiLangToggle {
      padding: 9px 16px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--panel); color: #fff; cursor: pointer; font-weight: 700;
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 22px 0 20px; text-align: center;
      font-size: clamp(24px, 4vw, 34px); text-shadow: 0 2px 12px #0004;
    }
    .app { width: min(100%, 960px) }
    .status-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px; margin-bottom: 14px;
    }
    .status-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(10px);
    }
    .status-label { font-size: 12px; opacity: .82 }
    .status-value {
      font-weight: 750; margin-top: 3px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .transcript-container {
      height: 44vh; min-height: 260px; background: #fff; color: #252525;
      border-radius: 16px; padding: 18px; overflow: auto;
      box-shadow: var(--shadow); scroll-behavior: smooth;
    }
    #transcript {
      margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
      font: 16px/1.8 "Noto Sans TC", "Segoe UI", sans-serif;
    }
    .placeholder { color: #888 }
    .interim { color: #777; font-style: italic }
    .meter {
      height: 20px; margin: 14px 0; background: #ffffff30;
      border: 1px solid var(--border); border-radius: 999px; overflow: hidden;
    }
    .meter>div {
      height: 100%; transform: scaleX(0); transform-origin: left;
      background: linear-gradient(90deg, #36b36e, #d8db3d, #ff6659);
      transition: transform .08s;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }
    .settings { display: block }
    .field { display: flex; gap: 7px; align-items: center; flex: 1; min-width: 240px }
    label { font-weight: 700 }
    .field select, .field input {
      flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #ffffff88;
      border-radius: 9px; background: #fff; color: #222;
    }
    .panel-label { display: block; font-weight: 700; margin: 0 0 10px }
    .engine-cards {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 10px; margin: 0 0 6px;
    }
    .engine-card {
      display: flex; flex-direction: column; gap: 5px; text-align: left;
      background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .25);
      border-radius: 12px; padding: 12px 14px; color: #fff; cursor: pointer;
      font: inherit; transition: transform .15s, border-color .15s, background .15s;
    }
    .engine-card:hover:not(:disabled) { transform: translateY(-2px); background: rgba(255, 255, 255, .2) }
    .engine-card.active {
      border-color: #ffe16b; background: rgba(255, 255, 255, .22);
      box-shadow: 0 0 0 3px #ffe16b44;
    }
    .engine-card:disabled { opacity: .55; cursor: not-allowed }
    .ecard-top { display: flex; justify-content: space-between; align-items: center; gap: 8px }
    .ecard-name { font-weight: 750; font-size: 15px; line-height: 1.25 }
    .ecard-tag { font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 999px; white-space: nowrap }
    .ecard-tag.local { background: #178a57; color: #fff }
    .ecard-tag.cloud { background: #b9751e; color: #fff }
    .ecard-desc { font-size: 12px; opacity: .88; line-height: 1.45 }
    .quickstart {
      margin: 10px 0 0; padding: 10px 14px; border-radius: 10px;
      background: #10102aaa; border: 1px solid #ffffff26; font-size: 13px; line-height: 1.65;
    }
    .quickstart b { color: #ffe16b }
    .quickstart code { background: #0004; padding: 1px 6px; border-radius: 5px; font-weight: 650 }
    .moss-filezone {
      position: relative; flex: 1; min-width: 250px; height: 62px;
      display: flex; align-items: center; justify-content: center;
      border: 2px dashed #ffffff66; border-radius: 10px; background: #ffffff12;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .moss-filezone.over { border-color: #ffe16b; background: #ffe16b22 }
    .moss-filezone input[type=file] {
      position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }
    .moss-filetext { font-size: 13px; font-weight: 700; pointer-events: none }
    @media(max-width:720px) { .engine-cards { grid-template-columns: 1fr 1fr } }
    .engine-config { display: none }
    .engine-config.visible { display: block }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px }
    .row:last-child { margin-bottom: 0 }
    .row label { min-width: 82px }
    .row select, .row input[type=url], .row input[type=text], .row input[type=file] {
      flex: 1; min-width: 230px; padding: 9px; border-radius: 8px;
      border: 1px solid #ddd; background: #fff; color: #222;
    }
    .hint { font-size: 13px; line-height: 1.55; color: #fff0a7; margin: 8px 0 0 }
    .hint a { color: #fff5b7; font-weight: 700 }
    .hint code { background: #0003; padding: 1px 5px; border-radius: 4px }
    .progress {
      height: 8px; background: #ffffff30; border-radius: 999px;
      overflow: hidden; margin-top: 10px; display: none;
    }
    .progress.visible { display: block }
    .progress>div { height: 100%; width: 0; background: #6de08e; transition: width .2s }
    .progress>div.indeterminate { width: 32%; animation: loading 1.2s infinite }
    @keyframes loading {
      from { transform: translateX(-120%) }
      to { transform: translateX(320%) }
    }
    .model-status { min-height: 20px; text-align: center; font-size: 13px; margin-top: 7px }
    .error { color: #ffd0d0 }
    .success { color: #c7ffd2 }
    .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0 }
    button.action {
      border: 1px solid #ffffff70; border-radius: 11px; padding: 13px 22px;
      color: #fff; font-weight: 750; cursor: pointer; box-shadow: 0 4px 14px #0003; transition: .2s;
    }
    button.action:hover:not(:disabled) { transform: translateY(-2px) }
    button:disabled { opacity: .52; cursor: not-allowed }
    #controlBtn { background: linear-gradient(135deg, #5268dd, #74429b); min-width: 155px }
    #controlBtn.listening { background: linear-gradient(135deg, #d94f4f, #aa2d55) }
    #copyBtn { background: #b87825 }
    #exportBtn { background: #16856f }
    #clearBtn { background: #c74747 }
    .notice {
      padding: 12px 15px; color: #161616; background: #ffd86a;
      border-radius: 10px; text-align: center; font-weight: 700; margin-bottom: 14px;
    }
    .notice.local { background: #a8ebba }
    .notice.partial { background: #ffe4a0 }
    details {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 20px;
    }
    summary { padding: 14px 17px; cursor: pointer; font-weight: 750 }
    .details-content { padding: 0 18px 18px; line-height: 1.65 }
    .details-content h3 { color: #fff0a7; margin-bottom: 5px }
    .details-content ul { margin-top: 5px; padding-left: 22px }
    #toast {
      position: fixed; z-index: 50; left: 50%; bottom: 24px;
      transform: translate(-50%, 18px); background: #1f2030ee; color: #fff;
      padding: 11px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
      transition: .25s; max-width: 90%; text-align: center; font-weight: 750;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0) }
    @media(max-width:720px) {
      body { padding: 12px }
      .status-grid { grid-template-columns: 1fr 1fr }
      .transcript-container { height: 42vh }
      .field { min-width: 100% }
      .controls { display: grid; grid-template-columns: 1fr 1fr }
      .action { width: 100% }
    }
    @media print {
      body { background: #fff; color: #000; padding: 0 }
      .topbar, h1, .status-grid, .meter, .panel, .controls, .notice, details { display: none !important }
      .app { width: 100% }
      .transcript-container { height: auto; box-shadow: none; padding: 0; overflow: visible }
      #transcript { font-size: 11pt }
    }
  </style>

<body>
  <div class="topbar"><button id="uiLangToggle" type="button">Switch to English</button></div>
  <h1 id="mainTitle">多國語言即時逐字稿工具</h1>
  <main class="app">
    <section class="status-grid" aria-label="執行狀態">
      <div class="status-card"><div class="status-label" id="statusEngineLabel">引擎</div><div class="status-value" id="statusEngineValue">Web Speech API</div></div>
      <div class="status-card"><div class="status-label" id="statusRuntimeLabel">執行環境</div><div class="status-value" id="statusRuntimeValue">瀏覽器服務</div></div>
      <div class="status-card"><div class="status-label" id="statusPrivacyLabel">音訊處理</div><div class="status-value" id="statusPrivacyValue">可能傳送至服務商</div></div>
      <div class="status-card"><div class="status-label" id="statusStateLabel">狀態</div><div class="status-value" id="statusStateValue">待命</div></div>
    </section>

    <section class="transcript-container" id="transcriptContainer" aria-live="polite" aria-label="逐字稿">
      <pre id="transcript"><span class="placeholder" id="placeholderText"></span><span id="finalText"></span><span id="interimText" class="interim"></span></pre>
    </section>
    <div class="meter" aria-label="麥克風音量"><div id="volumeLevel"></div></div>

    <section class="panel settings">
      <label id="engineLabel" class="panel-label">引擎：</label>
      <div class="engine-cards" id="engineCards" role="radiogroup" aria-label="引擎選擇">
        <button type="button" class="engine-card" data-engine="webspeech">
          <span class="ecard-top"><span class="ecard-name"></span><span class="ecard-tag cloud"></span></span>
          <span class="ecard-desc"></span>
        </button>
        <button type="button" class="engine-card" data-engine="vosk">
          <span class="ecard-top"><span class="ecard-name"></span><span class="ecard-tag local"></span></span>
          <span class="ecard-desc"></span>
        </button>
        <button type="button" class="engine-card" data-engine="sherpa">
          <span class="ecard-top"><span class="ecard-name"></span><span class="ecard-tag local"></span></span>
          <span class="ecard-desc"></span>
        </button>
        <button type="button" class="engine-card" data-engine="whisper">
          <span class="ecard-top"><span class="ecard-name"></span><span class="ecard-tag local"></span></span>
          <span class="ecard-desc"></span>
        </button>
        <button type="button" class="engine-card" data-engine="moss">
          <span class="ecard-top"><span class="ecard-name"></span><span class="ecard-tag cloud"></span></span>
          <span class="ecard-desc"></span>
        </button>
      </div>
      <select id="engineSelector" hidden>
        <option value="webspeech" id="optWebspeech">Web Speech API（雲端）</option>
        <option value="vosk" id="optVosk">Vosk（本機離線）</option>
        <option value="sherpa" id="optSherpa">sherpa-onnx（本機串流）</option>
        <option value="whisper" id="optWhisper">Whisper（本機 WebGPU/WASM）</option>
        <option value="moss" id="optMoss">MOSS 會議轉寫（雲端 Space，批次）</option>
      </select>
      <div class="field" id="languageField"><label for="languageSelector" id="langLabel">辨識語言：</label><select id="languageSelector">
        <option value="zh-TW">中文（台灣）</option><option value="zh-CN">中文（中國大陸）</option><option value="zh-HK">粵語（香港）</option>
        <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option><option value="es-ES">Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option>
      </select></div>
      <p class="quickstart" id="quickstartText"></p>
    </section>

    <section class="panel engine-config" id="voskConfig">
      <div class="row"><label for="voskModelSource" id="voskSourceLabel">模型來源：</label><select id="voskModelSource">
        <option value="builtin" id="optVoskBuiltin">網站內建模型</option><option value="file" id="optVoskFile">本機模型 ZIP</option><option value="url" id="optVoskUrl">自訂 URL</option>
      </select></div>
      <div class="row" id="voskBuiltinRow"><label for="voskBuiltinLang" id="voskModelLabel">模型：</label><select id="voskBuiltinLang">
        <option value="cn">中文 small（約 44 MB）</option><option value="en">English small（約 41 MB）</option>
      </select></div>
      <div class="row" id="voskFileRow" hidden><label for="voskModelFile" id="voskFileLabel">檔案：</label><input id="voskModelFile" type="file" accept=".zip"></div>
      <div class="row" id="voskUrlRow" hidden><label for="voskModelUrl">URL：</label><input id="voskModelUrl" type="url" placeholder="https://example.org/model.zip"></div>
      <div class="row"><button class="action" id="loadVoskBtn" type="button">載入模型</button></div>
      <div class="progress" id="voskProgress"><div id="voskProgressBar"></div></div><div class="model-status" id="voskStatus"></div>
      <p class="hint" id="voskHint"></p>
    </section>

    <section class="panel engine-config" id="sherpaConfig">
      <div class="row"><label for="sherpaBaseUrl" id="sherpaBaseLabel">資產位置：</label><input id="sherpaBaseUrl" type="text" value="https://huggingface.co/cormort/sherpa-zh-en-streaming/resolve/main/sherpa/" placeholder="https://huggingface.co/&lt;user&gt;/&lt;repo&gt;/resolve/main/sherpa/"></div>
      <div class="row"><button class="action" id="loadSherpaBtn" type="button">載入模型</button><button class="action" id="clearSherpaCacheBtn" type="button">清除已快取模型</button></div>
      <div class="progress" id="sherpaProgress"><div id="sherpaProgressBar"></div></div><div class="model-status" id="sherpaStatus"></div>
      <p class="hint" id="sherpaHint"></p>
    </section>

    <section class="panel engine-config" id="whisperConfig">
      <div class="row"><label for="whisperModelSelect" id="whisperModelLabel">模型：</label><select id="whisperModelSelect">
        <option value="tiny">Whisper tiny（約 40 MB，速度優先）</option><option value="base">Whisper base（約 74 MB）</option><option value="small" selected>Whisper small（約 240 MB，準確度優先）</option>
      </select></div>
      <div class="row"><label for="vadSensitivity" id="vadLabel">收音靈敏度：</label><select id="vadSensitivity">
        <option value="0.012" id="optVadHigh">高</option><option value="0.018" selected id="optVadMid">中</option><option value="0.028" id="optVadLow">低</option>
      </select></div>
      <div class="row"><button class="action" id="loadWhisperBtn" type="button">載入模型</button></div>
      <div class="progress" id="whisperProgress"><div id="whisperProgressBar"></div></div><div class="model-status" id="whisperStatus"></div>
      <p class="hint" id="whisperHint"></p>
    </section>

    <section class="panel engine-config" id="mossConfig">
      <div class="row"><label for="mossSpaceSelect" id="mossSpaceLabel">運算位置：</label><select id="mossSpaceSelect">
        <option value="official" id="optMossOfficial">Hugging Face 官方 Space（較快）</option>
        <option value="litert" id="optMossLitert">社群 LiteRT Space（回傳繁中）</option>
      </select></div>
      <div class="row"><label for="mossFile" id="mossFileLabel">音訊／影片檔：</label>
        <div class="moss-filezone" id="mossFileZone">
          <input id="mossFile" type="file" accept="audio/*,video/*">
          <span class="moss-filetext" id="mossFileText">點選檔案或拖放到此</span>
        </div>
      </div>
      <div class="row"><button class="action" id="mossRunBtn" type="button">開始轉寫</button><button class="action" id="mossSrtBtn" type="button" disabled>輸出 SRT 字幕</button></div>
      <div class="progress" id="mossProgress"><div id="mossProgressBar"></div></div><div class="model-status" id="mossStatus"></div>
      <p class="hint" id="mossHint"></p>
    </section>

    <section class="controls">
      <button class="action" id="controlBtn" type="button">開始辨識</button><button class="action" id="copyBtn" type="button" disabled>複製內容</button>
      <button class="action" id="exportBtn" type="button" disabled>輸出逐字稿</button><button class="action" id="clearBtn" type="button">清空</button>
    </section>
    <div class="notice" id="privacyNotice"></div>

    <details><summary id="privacySummary">使用須知與隱私聲明</summary><div class="details-content">
      <p id="howItWorksText"></p>
      <h3 id="enginesTitle"></h3><ul id="enginesList"></ul>
      <h3 id="riskTitle"></h3><ul id="riskList"></ul>
      <p id="privacyConclusion"></p>
    </div></details>
  </main><div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  // ==================== Audio capture and resampling ====================
  class AudioCapture {
    constructor(onChunk, onLevel) {
      this.onChunk = onChunk;
      this.onLevel = onLevel;
      this.stream = null;
      this.context = null;
      this.source = null;
      this.node = null;
      this.silent = null;
    }
    async start() {
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });
      this.context = new (window.AudioContext || window.webkitAudioContext)();
      await this.context.resume();

      const code = `class PCMProcessor extends AudioWorkletProcessor{
        constructor(){
          super();
          this.bufSize=2048;
          this.buf=new Float32Array(this.bufSize);
          this.idx=0;
        }
        process(inputs){
          const ch=inputs[0]&&inputs[0][0];
          if(!ch) return true;
          for(let i=0;i<ch.length;i++){
            this.buf[this.idx++]=ch[i];
            if(this.idx>=this.bufSize){
              this.port.postMessage(this.buf,[this.buf.buffer]);
              this.buf=new Float32Array(this.bufSize);
              this.idx=0;
            }
          }
          return true;
        }
      }
      registerProcessor('pcm-processor',PCMProcessor);`;

      if (!pcmWorkletModuleUrl) {
        pcmWorkletModuleUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      }

      await this.context.audioWorklet.addModule(pcmWorkletModuleUrl);
      this.source = this.context.createMediaStreamSource(this.stream);
      this.node = new AudioWorkletNode(this.context, 'pcm-processor');
      this.silent = this.context.createGain();
      this.silent.gain.value = 0;

      this.source.connect(this.node);
      this.node.connect(this.silent);
      this.silent.connect(this.context.destination);

      this.node.port.onmessage = e => {
        const input = e.data;
        let sum = 0;
        for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
        const rms = Math.sqrt(sum / input.length);
        this.onLevel?.(rms);
        const output = resample(input, this.context.sampleRate, SAMPLE_RATE);
        this.onChunk?.(output, rms);
      };
    }
    async stop() {
      const contextToClose = this.context;
      const streamToStop = this.stream;

      try {
        try { this.node?.disconnect(); } catch (e) { console.warn(e); }
        try { this.source?.disconnect(); } catch (e) { console.warn(e); }
        try { this.silent?.disconnect(); } catch (e) { console.warn(e); }
        try { streamToStop?.getTracks().forEach(track => track.stop()); } catch (e) { console.warn(e); }

        if (contextToClose && contextToClose.state !== 'closed') {
          try {
            await contextToClose.close();
          } catch (error) {
            console.warn('AudioContext close failed:', error);
          }
        }
      } finally {
        this.stream = null;
        this.context = null;
        this.source = null;
        this.node = null;
        this.silent = null;
        this.onLevel?.(0);
      }
    }

  function resample(input, from, to) {
    if (from === to) return input;
    const n = Math.max(1, Math.round(input.length * to / from)),
      out = new Float32Array(n), ratio = from / to;
    for (let i = 0; i < n; i++) {
      const p = i * ratio, a = Math.floor(p), b = Math.min(a + 1, input.length - 1), f = p - a;
      out[i] = input[a] * (1 - f) + input[b] * f;
    }
    return out;
  }

    const b = context.createBuffer(1, data.length, SAMPLE_RATE);
    b.copyToChannel(data, 0);

  function showToast(message) {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function getOpenccConverter(variant) {
    if (!window.OpenCC) return null;
    if (!openccConverters.has(variant)) {
      openccConverters.set(variant, window.OpenCC.Converter({ from: 'cn', to: variant }));
    }
    return openccConverters.get(variant);
  }

  function traditional(value) {
    if (!value || !window.OpenCC) return value;
    // Vosk 內建中文模型與 sherpa 中英模型必定輸出簡中，語言選單對它們無效
    const forcedChinese =
      state.engine === 'moss' ||
      state.engine === 'sherpa' ||
      (state.engine === 'vosk' && el.voskSource.value === 'builtin' && el.voskLang.value === 'cn');
    if (!forcedChinese && !el.lang.value.startsWith('zh')) return value;

    try {
      const variant = (!forcedChinese && el.lang.value === 'zh-HK') ? 'hk' : 'twp';
      const converter = getOpenccConverter(variant);
      return converter ? converter(value) : value;
    } catch (error) {
      console.warn('OpenCC conversion failed:', error);
      return value;
    }
  }

  function stamp(d = new Date()) {
    return `[${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}]`;
  }

  function commit(s) {
    s = traditional((s || '').trim());
    if (!s) return;
    state.segments.push({ time: new Date(), text: s });
    state.interim = '';
    render();
  }

  function getEffectiveSegments() {
    return state.segments.filter(segment => {
      const content = String(segment.text || '').trim();
      return content && !content.startsWith('--- Recording Start');
    });
  }

  function getEffectiveTranscriptText(lineSeparator = '\n') {
    return getEffectiveSegments()
      .map(segment => `${stamp(segment.time)} ${String(segment.text).trim()}`)
      .join(lineSeparator);
  }

  let renderedSegments = 0;
  let renderedText = '';

  function render() {
    el.placeholder.hidden = !!(state.segments.length || state.interim);

    // 快取被清空或段數縮減（clear）時，重建基底文字
    if (state.segments.length < renderedSegments) {
      renderedSegments = 0;
      renderedText = '';
      el.final.textContent = '';
    }
    // 只 append 新段落，避免每次都重建整份逐字稿
    if (state.segments.length > renderedSegments) {
      const delta = state.segments.slice(renderedSegments)
        .map(x => `${stamp(x.time)} ${x.text}`).join('\n');
      renderedText += (renderedText ? '\n' : '') + delta;
      renderedSegments = state.segments.length;
      el.final.textContent = renderedText;
    }

    const interimText = state.interim ? `\n${state.interim}` : '';
    if (el.interim.textContent !== interimText) el.interim.textContent = interimText;

    const hasContent = getEffectiveSegments().length > 0;
    el.copy.disabled = !hasContent;
    el.export.disabled = !hasContent;

    // 只在接近底部時才自動捲動，避免打斷閱讀舊內容
    const nearBottom = el.container.scrollHeight - el.container.scrollTop - el.container.clientHeight < 48;
    if (nearBottom) {
      requestAnimationFrame(() => {
        el.container.scrollTop = el.container.scrollHeight;
      });
    }
  }

  function setLevel(rms) {
    el.volume.style.transform = `scaleX(${Math.min(1, rms * 12)})`;
  }

  function begin() {
    state.start = new Date();
    state.end = null;
    state.segments = [];
    state.interim = '';
    commit('--- Recording Start / 錄音開始 ---');
  }

  function finish() {
    state.end = new Date();
    state.running = false;
    state.stopping = false;
    state.interim = '';
    el.engine.disabled = false;
    el.lang.disabled = false;
    updateButtons();
    render();
    setLevel(0);
  }

  function updateButtons() {
    const batch = state.engine === 'moss';
    el.control.textContent = batch ? t().mossBatchMode
      : (state.stopping ? t().stopping : (state.running ? t().stop : t().start));
    el.control.classList.toggle('listening', state.running && !batch);
    el.control.disabled = batch || state.stopping;
    el.statusState.textContent = state.stopping ? t().processing : (state.running ? t().listening : t().idle);
    document.title = (state.running ? '● ' : '') + t().pageTitle;
    syncEngineCards();
  }

  function syncEngineCards() {
    const lock = el.engine.disabled || state.running || state.stopping || moss.running;
    el.engineCards.classList.toggle('locked', lock);
    for (const card of el.engineCards.querySelectorAll('.engine-card')) {
      const active = card.dataset.engine === state.engine;
      card.classList.toggle('active', active);
      card.setAttribute('aria-pressed', active ? 'true' : 'false');
      card.disabled = lock;
    }
  }

  function updateEngine() {
    state.engine = el.engine.value;
    el.voskConfig.classList.toggle('visible', state.engine === 'vosk');
    el.sherpaConfig.classList.toggle('visible', state.engine === 'sherpa');
    el.whisperConfig.classList.toggle('visible', state.engine === 'whisper');
    el.mossConfig.classList.toggle('visible', state.engine === 'moss');
    // Vosk 與 sherpa 的語言由模型決定，隱藏語言選單
    el.languageField.style.display = (state.engine === 'vosk' || state.engine === 'sherpa' || state.engine === 'moss') ? 'none' : '';

    const local = state.engine !== 'webspeech' && state.engine !== 'moss';
    const icon = local ? '🔒 ' : '☁️ ';
    el.notice.textContent = icon + (state.engine === 'moss' ? t().mossNotice : (local ? t().localNotice : t().webNotice));
    el.notice.className = 'notice ' + (local ? 'local' : 'partial');
    el.statusEngine.textContent = { webspeech: 'Web Speech API', vosk: 'Vosk', sherpa: 'sherpa-onnx', whisper: 'Whisper', moss: 'MOSS-Transcribe-Diarize' }[state.engine];
    el.statusRuntime.textContent = {
      webspeech: t().browserService, vosk: 'WASM / CPU', sherpa: 'WASM / CPU',
      whisper: whisper.device || 'WebGPU / WASM',
      moss: el.mossSpace.value === 'litert' ? 'HF Space / LiteRT' : 'HF Space / CPU'
    }[state.engine];
    el.statusPrivacy.textContent = icon + (local ? t().localProcessing : t().cloudProcessing);
    el.quickstart.innerHTML = t().quickstart[state.engine] || '';
    updateButtons();
    save();
  }

  async function loadScript(src, globalName) {
    if (globalName && window[globalName]) return window[globalName];
    if (scriptLoadPromises.has(src)) return scriptLoadPromises.get(src);

    const loadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.async = false;
      script.dataset.dynamicSrc = src;
      script.onload = () => {
        if (globalName && !window[globalName]) {
          script.remove();
          reject(new Error(`Script loaded, but window.${globalName} is unavailable.`));
          return;
        }
        resolve(globalName ? window[globalName] : true);
      };
      script.onerror = () => {
        script.remove();
        reject(new Error(`Script load failed: ${src}`));
      };
      document.head.appendChild(script);
    });

    scriptLoadPromises.set(src, loadPromise);
    try {
      return await loadPromise;
    } catch (error) {
      scriptLoadPromises.delete(src);
      throw error;
    }
  }

  async function disposeWhisperPipeline(pipeline) {
    if (!pipeline || typeof pipeline.dispose !== 'function') return;
    try {
      await pipeline.dispose();
    } catch (error) {
      console.warn('Whisper pipeline disposal failed:', error);
    }
  }

  function removeVoskRecognizer() {
    const recognizerToRemove = vosk.recognizer;
    vosk.recognizer = null;
    if (!recognizerToRemove) return;
    try {
      recognizerToRemove.remove?.();
    } catch (error) {
      console.warn('Vosk recognizer cleanup failed:', error);
    }
  }

  async function terminateVoskModel(model) {
    if (!model) return;
    try {
      const result = model.terminate?.();
      if (result && typeof result.then === 'function') await result;
    } catch (error) {
      console.warn('Vosk model termination failed:', error);
    }
  }

  // ==================== Vosk offline engine ====================
  async function loadVosk() {
    if (vosk.loadPromise) return vosk.loadPromise;
    const generation = ++vosk.loadGeneration;

    vosk.loadPromise = (async () => {
      el.loadVosk.disabled = true;
      el.voskProgress.classList.add('visible');
      el.voskBar.classList.add('indeterminate');
      el.voskStatus.textContent = t().voskLoading;
      el.voskStatus.className = 'model-status';

      let modelUrl = null;
      let revokeModelUrl = false;
      let newlyCreatedModel = null;

      try {
        await loadScript(CDN.vosk, 'Vosk');

        const source = el.voskSource.value;
        if (source === 'builtin') {
          if (window.location.protocol === 'file:') throw new Error(t().voskFileProtocol);
          modelUrl = VOSK_MODELS[el.voskLang.value];
        } else if (source === 'file') {
          const file = el.voskFile.files[0];
          if (!file) throw new Error(t().voskNoFile);
          modelUrl = URL.createObjectURL(file);
          revokeModelUrl = true;
        } else {
          modelUrl = el.voskUrl.value.trim();
          if (!modelUrl) throw new Error(t().voskNoUrl);
        }

        removeVoskRecognizer();

        const previousModel = vosk.model;
        vosk.model = null;
        vosk.loaded = false;
        await terminateVoskModel(previousModel);

        if (generation !== vosk.loadGeneration) return;

        newlyCreatedModel = await Vosk.createModel(modelUrl);

        if (generation !== vosk.loadGeneration) {
          await terminateVoskModel(newlyCreatedModel);
          return;
        }

        vosk.model = newlyCreatedModel;
        newlyCreatedModel = null;
        vosk.loaded = true;
        el.voskStatus.textContent = t().loaded;
        el.voskStatus.className = 'model-status success';
      } catch (error) {
        console.error('Vosk model load failed:', error);
        await terminateVoskModel(newlyCreatedModel);

        if (generation === vosk.loadGeneration) {
          vosk.loaded = false;
          vosk.model = null;
          el.voskStatus.textContent = t().loadFailed + (error.message || error);
          el.voskStatus.className = 'model-status error';
        }
      } finally {
        if (revokeModelUrl && modelUrl) URL.revokeObjectURL(modelUrl);
        if (generation === vosk.loadGeneration) {
          el.voskBar.classList.remove('indeterminate');
          el.voskBar.style.width = vosk.loaded ? '100%' : '0';
          el.loadVosk.disabled = false;
        }
      }
    })();

    try {
      await vosk.loadPromise;
    } finally {
      if (generation === vosk.loadGeneration) vosk.loadPromise = null;
    }
  }

  async function startVosk() {
    if (!vosk.loaded) return showToast(t().loadFirst);
    begin();
    state.running = true;
    updateButtons();
    el.engine.disabled = el.lang.disabled = true;
    try {
      vosk.recognizer = new vosk.model.KaldiRecognizer(SAMPLE_RATE);
      vosk.recognizer.setWords(false);
      vosk.recognizer.on('result', m => commit(m.result?.text));
      vosk.recognizer.on('partialresult', m => {
        state.interim = traditional(m.result?.partial || '');
        render();
      });
      const activeRecognizer = vosk.recognizer;

      vosk.session = new AudioCapture(chunk => {
        if (!state.running || state.stopping) return;
        if (!activeRecognizer || activeRecognizer !== vosk.recognizer) return;
        if (!vosk.session?.context || vosk.session.context.state === 'closed') return;

        try {
          activeRecognizer.acceptWaveform(makeAudioBuffer(vosk.session.context, chunk));
        } catch (error) {
          console.warn('Vosk audio chunk ignored:', error);
        }
      }, setLevel);
      await vosk.session.start();
    } catch (e) {
      console.error(e);
      showToast(t().mic);
      await stopVosk();
    }
  }

  async function stopVosk() {
    state.stopping = true;
    state.running = false;
    updateButtons();
    await vosk.session?.stop();
    vosk.session = null;
    removeVoskRecognizer();
    finish();
  }

  // ==================== sherpa-onnx streaming engine ====================
  function setSherpaProgress(loaded, total) {
    const mb = n => (n / 1048576).toFixed(1);
    if (total) {
      el.sherpaBar.classList.remove('indeterminate');
      el.sherpaBar.style.width = `${(loaded / total * 100).toFixed(1)}%`;
      el.sherpaStatus.textContent =
        `${t().sherpaDownloading} ${mb(loaded)} / ${mb(total)} MB（${(loaded / total * 100).toFixed(1)}%）`;
    } else {
      el.sherpaStatus.textContent = `${t().sherpaDownloading} ${mb(loaded)} MB`;
    }
  }

  const CHUNK_BYTES = 8 * 1024 * 1024;

  async function fetchRange(url, start, end, attempts = 4) {
    for (let attempt = 1; ; attempt += 1) {
      try {
        const response = await fetch(url, { headers: { Range: `bytes=${start}-${end}` } });
        if (response.status !== 206) throw new Error(`expected 206, got ${response.status}`);
        return await response.arrayBuffer();
      } catch (error) {
        if (attempt >= attempts) throw error;
        // 退避後重試：慢速線路上大檔很容易被中斷，重來一段比重來整份便宜
        await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
      }
    }
  }

  // 單一個 199 MB 的 fetch 只要閃斷一次就全部作廢，改成分段抓、逐段重試。
  // ponytail: 段落只存在記憶體，重整頁面仍會從頭開始；要跨重整續傳再說。
  async function downloadInChunks(url) {
    const probe = await fetch(url, { headers: { Range: 'bytes=0-0' } });
    if (!probe.ok) throw new Error(`${probe.status}: ${url}`);

    const contentRange = probe.headers.get('Content-Range');
    const total = probe.status === 206 && contentRange
      ? Number(contentRange.split('/')[1])
      : 0;

    // 伺服器不支援 Range 就退回單次串流下載
    if (!total) return streamWhole(url);

    const bytes = new Uint8Array(total);
    let loaded = 0;

    for (let start = 0; start < total; start += CHUNK_BYTES) {
      const end = Math.min(start + CHUNK_BYTES, total) - 1;
      const part = await fetchRange(url, start, end);
      bytes.set(new Uint8Array(part), start);
      loaded += part.byteLength;
      setSherpaProgress(loaded, total);
    }

    return bytes;
  }

  async function streamWhole(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${response.status}: ${url}`);

    const total = Number(response.headers.get('Content-Length')) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      setSherpaProgress(loaded, total);
    }

    const bytes = new Uint8Array(loaded);
    let offset = 0;
    for (const chunk of chunks) {
      bytes.set(chunk, offset);
      offset += chunk.length;
    }
    return bytes;
  }

  // 回傳 .data 的 ArrayBuffer：優先讀 Cache Storage，沒有才下載並存起來。
  // ponytail: 快取失敗（配額不足、非安全環境）就退回純下載，功能不受影響。
  async function fetchSherpaPackage(url) {
    let cache = null;
    try {
      cache = await caches.open(SHERPA_CACHE);
    } catch (error) {
      console.warn('Cache Storage unavailable:', error);
    }

    if (cache) {
      const hit = await cache.match(url);
      if (hit) {
        el.sherpaStatus.textContent = t().sherpaFromCache;
        el.sherpaBar.classList.remove('indeterminate');
        el.sherpaBar.style.width = '100%';
        return hit.arrayBuffer();
      }
    }

    const bytes = await downloadInChunks(url);

    if (cache) {
      try {
        await cache.put(url, new Response(bytes, {
          headers: { 'Content-Type': 'application/octet-stream' }
        }));
      } catch (error) {
        console.warn('Caching the sherpa package failed:', error);
        showToast(t().sherpaCacheFailed);
      }
    }

    return bytes.buffer;
  }

  async function clearSherpaCache() {
    try {
      const deleted = await caches.delete(SHERPA_CACHE);
      showToast(deleted ? t().sherpaCacheCleared : t().sherpaCacheEmpty);
    } catch (error) {
      console.error('Clearing the sherpa cache failed:', error);
      showToast(t().sherpaCacheFailed);
    }
  }

  // ponytail: emscripten 的 Module 是單例，WASM 只能載入一次；換資產位置需重新整理頁面。
  async function loadSherpa() {
    if (sherpa.loadPromise) return sherpa.loadPromise;

    const base = el.sherpaBase.value.trim();
    if (!base) {
      el.sherpaStatus.textContent = t().sherpaNoBase;
      el.sherpaStatus.className = 'model-status error';
      return;
    }
    if (sherpa.loaded) {
      if (sherpa.base !== base.replace(/\/?$/, '/')) {
        el.sherpaStatus.textContent = t().sherpaReloadNeeded;
        el.sherpaStatus.className = 'model-status error';
        return;
      }
      el.sherpaStatus.textContent = t().loaded;
      el.sherpaStatus.className = 'model-status success';
      return;
    }

    const dir = new URL(base.replace(/\/?$/, '/'), document.baseURI).href;

    sherpa.loadPromise = (async () => {
      el.loadSherpa.disabled = true;
      el.sherpaProgress.classList.add('visible');
      el.sherpaBar.classList.add('indeterminate');
      el.sherpaStatus.textContent = t().sherpaLoading;
      el.sherpaStatus.className = 'model-status';

      try {
        await loadScript(dir + 'sherpa-onnx-asr.js', 'createOnlineRecognizer');

        // 自行取得 199 MB 的 .data 並存進 Cache Storage，再用 getPreloadedPackage
        // 交給 emscripten，避免每次開頁面重抓（HF 沒給 Cache-Control，
        // 這個預建包也沒開 --use-preload-cache）
        const packageData = await fetchSherpaPackage(dir + SHERPA_DATA_FILE);

        // sherpa 的 emscripten glue 讀取全域 Module，必須在載入 wasm 主檔前設定好
        const ready = new Promise((resolve, reject) => {
          window.Module = {
            locateFile: path => dir + path,
            getPreloadedPackage: () => packageData,
            setStatus: status => {
              if (status) el.sherpaStatus.textContent = status;
            },
            onRuntimeInitialized: () => resolve(window.Module),
            onAbort: reason => reject(new Error(String(reason)))
          };
        });

        await loadScript(dir + 'sherpa-onnx-wasm-main-asr.js');
        sherpa.module = await ready;

        sherpa.recognizer = window.createOnlineRecognizer(sherpa.module);
        sherpa.loaded = true;
        sherpa.base = dir;
        el.sherpaStatus.textContent = t().loaded;
        el.sherpaStatus.className = 'model-status success';
      } catch (error) {
        console.error('sherpa-onnx load failed:', error);
        sherpa.loaded = false;
        sherpa.recognizer = null;
        sherpa.module = null;
        el.sherpaStatus.textContent = t().loadFailed + (error.message || error);
        el.sherpaStatus.className = 'model-status error';
      } finally {
        el.sherpaBar.classList.remove('indeterminate');
        el.sherpaBar.style.width = sherpa.loaded ? '100%' : '0';
        el.loadSherpa.disabled = false;
        sherpa.loadPromise = null;
      }
    })();

    return sherpa.loadPromise;
  }

  // 在音訊回呼中同步解碼。串流 Zipformer 的 RTF 遠低於 1，主執行緒吃得下。
  // ponytail: 單執行緒同步解碼；若在低階機器上卡住 UI，再搬進 Worker。
  function sherpaDecode(sessionId) {
    if (sessionId !== sherpa.sessionId || !sherpa.recognizer || !sherpa.stream) return;

    while (sherpa.recognizer.isReady(sherpa.stream)) {
      sherpa.recognizer.decode(sherpa.stream);
    }

    const partial = (sherpa.recognizer.getResult(sherpa.stream)?.text || '').trim();

    if (sherpa.recognizer.isEndpoint(sherpa.stream)) {
      sherpa.recognizer.reset(sherpa.stream);
      if (partial) {
        commit(partial);
        return;
      }
    }
    state.interim = traditional(partial);
    render();
  }

  async function startSherpa() {
    if (!sherpa.loaded || !sherpa.recognizer) return showToast(t().loadFirst);

    begin();
    state.running = true;
    state.stopping = false;
    sherpa.sessionId += 1;
    const sessionId = sherpa.sessionId;
    updateButtons();
    el.engine.disabled = el.lang.disabled = true;

    try {
      sherpa.stream = sherpa.recognizer.createStream();
      sherpa.session = new AudioCapture(chunk => {
        if (!state.running || state.stopping) return;
        if (sessionId !== sherpa.sessionId || !sherpa.stream) return;
        try {
          sherpa.stream.acceptWaveform(SAMPLE_RATE, chunk);
          sherpaDecode(sessionId);
        } catch (error) {
          console.warn('sherpa audio chunk ignored:', error);
        }
      }, setLevel);
      await sherpa.session.start();
    } catch (error) {
      console.error(error);
      showToast(t().mic);
      await stopSherpa();
    }
  }

  async function stopSherpa() {
    if (state.stopping) return;
    state.stopping = true;
    state.running = false;
    updateButtons();

    const sessionId = sherpa.sessionId;
    try {
      if (sherpa.stream && sherpa.recognizer) {
        // 補 0.4 秒靜音，讓模型吐出最後一段尚未收尾的語音
        sherpa.stream.acceptWaveform(SAMPLE_RATE, new Float32Array(Math.round(SAMPLE_RATE * 0.4)));
        sherpa.stream.inputFinished();
        while (sessionId === sherpa.sessionId && sherpa.recognizer.isReady(sherpa.stream)) {
          sherpa.recognizer.decode(sherpa.stream);
        }
        commit(sherpa.recognizer.getResult(sherpa.stream)?.text || '');
      }
    } catch (error) {
      console.warn('sherpa flush failed:', error);
    } finally {
      try { sherpa.stream?.free(); } catch (error) { console.warn(error); }
      sherpa.stream = null;
      await sherpa.session?.stop();
      sherpa.session = null;
      finish();
    }
  }

  // ==================== Whisper VAD and offline engine ====================
  function createVad() {
    return {
      speaking: false, silence: 0, speech: 0,
      pre: [], audio: [], samples: 0, threshold: +el.vad.value
    };
  }

  function vadPush(v, chunk, rms) {
    const ms = chunk.length / SAMPLE_RATE * 1000;
    v.pre.push(chunk);
    let preN = v.pre.reduce((n, x) => n + x.length, 0);
    while (preN > SAMPLE_RATE * .4) {
      preN -= v.pre[0].length;
      v.pre.shift();
    }
    if (rms >= v.threshold) {
      if (!v.speaking) {
        v.speaking = true;
        v.audio = [...v.pre];
        v.samples = v.audio.reduce((n, x) => n + x.length, 0);
      }
      v.silence = 0;
      v.speech += ms;
      v.audio.push(chunk);
      v.samples += chunk.length;
    } else if (v.speaking) {
      v.silence += ms;
      v.audio.push(chunk);
      v.samples += chunk.length;
      if (v.silence >= 800 || v.samples >= SAMPLE_RATE * 15) {
        const audio = concat(v.audio, v.samples);
        const valid = v.speech >= 800;
        v.speaking = false;
        v.silence = v.speech = v.samples = 0;
        v.audio = [];
        return valid ? audio : null;
      }
    }
    return null;
  }

  function vadFlush(v) {
    if (v.speaking && v.speech >= 800) {
      const x = concat(v.audio, v.samples);
      v.speaking = false;
      v.audio = [];
      v.samples = 0;
      return x;
    }
    return null;
  }

  function concat(parts, n) {
    const out = new Float32Array(n);
    let p = 0;
    for (const x of parts) {
      out.set(x, p);
      p += x.length;
    }
    return out;
  }

  async function loadWhisper() {
    if (whisper.loadPromise) return whisper.loadPromise;
    const generation = ++whisper.loadGeneration;

    whisper.loadPromise = (async () => {
      el.loadWhisper.disabled = true;
      el.whisperProgress.classList.add('visible');
      el.whisperBar.classList.add('indeterminate');
      el.whisperStatus.textContent = t().whisperLoading;
      el.whisperStatus.className = 'model-status';

      let candidatePipeline = null;
      let candidateDevice = null;

      try {
        whisper.module ||= await import(CDN.transformers);
        whisper.module.env.allowLocalModels = false;
        whisper.module.env.useBrowserCache = true;

        const modelName = WHISPER_MODELS[el.whisperModel.value];
        if (whisper.pipe && whisper.model === modelName) {
          el.whisperStatus.textContent = `${t().loaded}（${whisper.device}）`;
          el.whisperStatus.className = 'model-status success';
          return;
        }

        if (whisper.drainPromise || whisper.queue.length > 0) await waitForWhisperDrain();

        const previousPipeline = whisper.pipe;
        whisper.pipe = null;
        whisper.model = null;
        whisper.device = null;
        await disposeWhisperPipeline(previousPipeline);

        if (generation !== whisper.loadGeneration) return;

        if (navigator.gpu) {
          try {
            candidatePipeline = await whisper.module.pipeline(
              'automatic-speech-recognition', modelName, { device: 'webgpu', dtype: 'q4' });
            candidateDevice = 'WebGPU';
          } catch (error) {
            console.warn('WebGPU pipeline failed; falling back to WASM:', error);
          }
        }

        if (!candidatePipeline) {
          // wasm 上 q8 的 decoder 量化在 transformers.js 4.2.0 會崩（Missing required scale），
          // 且失敗載入會毒化瀏覽器模型快取；退回路徑必須用 q4
          candidatePipeline = await whisper.module.pipeline(
            'automatic-speech-recognition', modelName, { device: 'wasm', dtype: 'q4' });
          candidateDevice = 'WASM';
        }

        if (generation !== whisper.loadGeneration) {
          await disposeWhisperPipeline(candidatePipeline);
          return;
        }

        whisper.pipe = candidatePipeline;
        candidatePipeline = null;
        whisper.model = modelName;
        whisper.device = candidateDevice;
        el.whisperStatus.textContent = `${t().loaded}（${whisper.device}）`;
        el.whisperStatus.className = 'model-status success';
        if (state.engine === 'whisper') el.statusRuntime.textContent = whisper.device;
      } catch (error) {
        console.error('Whisper model load failed:', error);
        await disposeWhisperPipeline(candidatePipeline);

        if (generation === whisper.loadGeneration) {
          whisper.pipe = null;
          whisper.model = null;
          whisper.device = null;
          el.whisperStatus.textContent = t().loadFailed + (error.message || error);
          el.whisperStatus.className = 'model-status error';
        }
      } finally {
        if (generation === whisper.loadGeneration) {
          el.whisperBar.classList.remove('indeterminate');
          el.whisperBar.style.width = whisper.pipe ? '100%' : '0';
          el.loadWhisper.disabled = false;
        }
      }
    })();

    try {
      await whisper.loadPromise;
    } finally {
      if (generation === whisper.loadGeneration) whisper.loadPromise = null;
    }
  }

  function enqueueWhisperAudio(audio) {
    whisper.queue.push({ audio, language: el.lang.value, sessionId: whisper.sessionId });
    void processWhisperQueue();
  }

  function processWhisperQueue() {
    if (whisper.drainPromise) return whisper.drainPromise;
    const processingSessionId = whisper.sessionId;

    whisper.drainPromise = (async () => {
      whisper.busy = true;
      try {
        while (whisper.queue.length > 0) {
          const job = whisper.queue.shift();
          if (!job || job.sessionId !== processingSessionId) continue;

          el.statusState.textContent = t().processing;
          try {
            const output = await whisper.pipe(job.audio, {
              language: LANG[job.language],
              task: 'transcribe',
              chunk_length_s: 15,
              stride_length_s: 2
            });
            const text = String(output?.text || '').trim();
            if (job.sessionId === whisper.sessionId && text) commit(text);
          } catch (error) {
            console.error('Whisper inference failed:', error);
            showToast(t().whisperFailed + (error.message || error));
            const msg = String(error?.message || '').toLowerCase();
            if (msg.includes('device lost') || msg.includes('webgpu') || msg.includes('oom')) {
              whisper.pipe = null;
              whisper.model = null;
              el.whisperStatus.textContent = t().whisperDeviceLost;
              el.whisperStatus.className = 'model-status error';
            }
          }
        }
      } finally {
        whisper.busy = false;
        whisper.drainPromise = null;
        if (state.running) el.statusState.textContent = t().listening;
        if (whisper.queue.length > 0) void processWhisperQueue();
      }
    })();

    return whisper.drainPromise;
  }

  async function waitForWhisperDrain() {
    while (whisper.drainPromise || whisper.queue.length > 0) {
      await (whisper.drainPromise || processWhisperQueue());
    }
  }

  async function startWhisper() {
    const selectedModel = WHISPER_MODELS[el.whisperModel.value];
    if (!whisper.pipe || whisper.model !== selectedModel) return showToast(t().loadFirst);

    if (whisper.drainPromise || whisper.queue.length > 0) {
      state.stopping = true;
      updateButtons();
      el.statusState.textContent = t().processing;

      try {
        await waitForWhisperDrain();
      } catch (error) {
        console.error('Failed to drain previous Whisper session:', error);
        showToast(t().whisperBusy);
        state.stopping = false;
        updateButtons();
        return;
      }
      state.stopping = false;
    }

    begin();
    state.running = true;
    state.stopping = false;
    whisper.sessionId += 1;
    whisper.queue = [];
    updateButtons();
    el.engine.disabled = el.lang.disabled = true;

    const vad = createVad();
    whisper.vad = vad;

    try {
      whisper.session = new AudioCapture((chunk, rms) => {
        if (!state.running || state.stopping) return;
        const utterance = vadPush(vad, chunk, rms);
        state.interim = vad.speaking ? t().capturing : '';
        render();
        if (utterance) enqueueWhisperAudio(utterance);
      }, setLevel);
      await whisper.session.start();
    } catch (error) {
      console.error(error);
      showToast(t().mic);
      await stopWhisper();
    }
  }

  async function stopWhisper() {
    if (state.stopping) return;
    state.stopping = true;
    state.running = false;
    updateButtons();

    const finalAudio = whisper.vad ? vadFlush(whisper.vad) : null;
    if (finalAudio) enqueueWhisperAudio(finalAudio);

    try {
      await whisper.session?.stop();
    } catch (error) {
      console.warn('Whisper audio session cleanup failed:', error);
    } finally {
      whisper.session = null;
    }

    await waitForWhisperDrain();
    finish();
  }

  // ==================== Web Speech API engine ====================
  function clearWebRestartTimer() {
    if (state.restartTimer) {
      clearTimeout(state.restartTimer);
      state.restartTimer = null;
    }
  }

  function initWebSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => { state.webRecognitionActive = true; };

    recognition.onresult = event => {
      state.interim = '';
      let finalText = '';

      for (let index = event.resultIndex; index < event.results.length; index += 1) {
        const transcript = event.results[index][0].transcript;
        if (event.results[index].isFinal) finalText += transcript + ' ';
        else state.interim += transcript;
      }

      if (finalText.trim()) commit(finalText);
      else render();
    };

    recognition.onerror = event => {
      console.error('Web Speech error:', event);
      state.webRecognitionActive = false;

      if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture'].includes(event.error)) {
        state.manualStop = true;
        clearWebRestartTimer();
        setLevel(0);

        if (event.error === 'network') showToast(t().netError);
        else if (event.error === 'audio-capture') showToast(t().micBusy);
        else showToast(t().mic);
      }
    };

    recognition.onend = () => {
      state.webRecognitionActive = false;
      clearWebRestartTimer();

      if (state.running && !state.manualStop) {
        const scheduledGeneration = state.webGeneration;

        state.restartTimer = setTimeout(() => {
          state.restartTimer = null;
          const isCurrentGeneration = scheduledGeneration === state.webGeneration;
          const shouldRestart = state.running && !state.manualStop && !state.webRecognitionActive;
          if (!isCurrentGeneration || !shouldRestart) return;

          try {
            recognition.start();
          } catch (error) {
            if (error?.name !== 'InvalidStateError') console.error('Web Speech restart failed:', error);
          }
        }, WEB_RESTART_DELAY);
      } else {
        setLevel(0);
        finish();
      }
    };

    state.recognition = recognition;
  }

  function startWeb() {
    if (!state.recognition) return showToast(t().noWebSpeech);

    clearWebRestartTimer();
    state.webGeneration += 1;
    state.webRecognitionActive = false;

    begin();
    state.running = true;
    state.manualStop = false;
    state.recognition.lang = el.lang.value;
    el.engine.disabled = el.lang.disabled = true;
    updateButtons();
    setLevel(0);

    try {
      state.recognition.start();
    } catch (error) {
      console.error('Web Speech start failed:', error);
      state.manualStop = true;
      setLevel(0);
      finish();
    }
  }

  function stopWeb() {
    state.manualStop = true;
    state.stopping = true;
    state.webGeneration += 1;
    clearWebRestartTimer();
    updateButtons();

    try {
      if (state.webRecognitionActive) state.recognition.stop();
      else { setLevel(0); finish(); }
    } catch (error) {
      console.warn('Web Speech stop failed:', error);
      setLevel(0);
      finish();
    }
  }

  const ENGINES = {
    vosk: { start: startVosk, stop: stopVosk },
    sherpa: { start: startSherpa, stop: stopSherpa },
    whisper: { start: startWhisper, stop: stopWhisper },
    webspeech: { start: startWeb, stop: stopWeb },
    moss: { start: () => showToast(t().mossBatchMode), stop: () => {} }
  };

  async function toggle() {
    if (state.stopping) return;
    const engine = ENGINES[state.engine] || ENGINES.webspeech;
    await (state.running ? engine.stop() : engine.start());
  }

  // ==================== UI, preferences, export ====================
  // ==================== MOSS-Transcribe-Diarize（雲端 Hugging Face Space）====================
  // 批次轉寫：整段音訊／影片上傳後，一次取回含時間戳與說話人標籤的逐字稿。
  // 音訊會離開瀏覽器送到第三方 Space，因此隱私等級與 Web Speech API 同級（雲端），
  // 不列入 privacyConclusion 的「敏感內容請改用」清單。
  const moss = { running: false, segments: [] };
  let mossProgressTimer = null;

  const MOSS_SPACES = {
    official: { host: 'https://openmoss-team-moss-transcribe-diarize.hf.space', apiName: 'run_transcription', mode: 'gradio' },
    litert: { host: 'https://luigi-moss-transcribe-diarize-litert.hf.space', mode: 'rest' }
  };

  function mediaClock(seconds) {
    const total = Math.max(0, Math.floor(Number(seconds) || 0));
    return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
  }

  // 官方 Space 回傳純文字，每段一行："[0.07-4.89] [S01] 文字"
  // 逐行解析，文字內含 [ 也不截斷
  function parseMossGradio(text) {
    const out = [];
    const linePattern = /^\[\s*(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*\]\s*\[(S\d+)\]\s*(.*)$/;
    for (const line of String(text || '').split(/\r?\n/)) {
      const hit = linePattern.exec(line);
      if (!hit) continue;
      const body = hit[4].trim();
      if (body) out.push({ start: +hit[1], end: +hit[2], spk: hit[3], text: body });
    }
    return out;
  }

  // LiteRT Space 的 REST 路由已回傳解析好的 segments
  function parseMossSegments(segments) {
    return (segments || [])
      .map(x => ({ start: x.start, end: x.end, spk: x.spk || 'S01', text: String(x.text || '').trim() }))
      .filter(x => x.text);
  }

  function mossLine(seg) {
    const range = seg.end == null ? mediaClock(seg.start) : `${mediaClock(seg.start)}-${mediaClock(seg.end)}`;
    return `[${range}] [${seg.spk}] ${seg.text}`;
  }

  function setMossProgress(ratio) {
    if (ratio === null) {
      el.mossBar.classList.add('indeterminate');
      el.mossBar.style.width = '';
      return;
    }
    el.mossBar.classList.remove('indeterminate');
    el.mossBar.style.width = `${ratio}%`;
  }

  function hideMossProgressLater() {
    clearTimeout(mossProgressTimer);
    mossProgressTimer = setTimeout(() => {
      el.mossProgress.classList.remove('visible');
      setMossProgress(0);
      mossProgressTimer = null;
    }, 800);
  }

  function updateMossFileText() {
    const file = el.mossFile.files && el.mossFile.files[0];
    el.mossFileText.textContent = file ? `${file.name} (${(file.size / 1048576).toFixed(1)} MB)` : t().mossPickHint;
  }

  function mossSrtTime(seconds) {
    const raw = Math.max(0, Number(seconds) || 0);
    const totalMs = Math.round(raw * 1000);
    const h = Math.floor(totalMs / 3600000);
    const m = Math.floor((totalMs % 3600000) / 60000);
    const s = Math.floor((totalMs % 60000) / 1000);
    const ms = totalMs % 1000;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
  }

  function exportMossSrt() {
    if (!moss.segments.length) return;
    const body = moss.segments.map((seg, i) => {
      const end = Number(seg.end) > 0 ? Number(seg.end) : seg.start;
      return `${i + 1}\n${mossSrtTime(seg.start)} --> ${mossSrtTime(end)}\n[${seg.spk}] ${seg.text}\n`;
    }).join('\n');
    const base = String((el.mossFile.files && el.mossFile.files[0]?.name) || 'transcript').replace(/\.[^.]+$/, '') || 'transcript';
    const blob = new Blob(['\uFEFF' + body], { type: 'text/plain;charset=utf-8' });
    const anchor = document.createElement('a');
    const objectUrl = URL.createObjectURL(blob);
    anchor.href = objectUrl;
    anchor.download = `${base}.srt`;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 500);
  }

  async function runMoss() {
    const file = el.mossFile.files && el.mossFile.files[0];
    if (!file) { showToast(t().mossPickFile); return; }
    if (moss.running) return;

    const space = MOSS_SPACES[el.mossSpace.value] || MOSS_SPACES.official;
    const startedAt = Date.now();
    moss.running = true;
    moss.segments = [];
    el.mossSrt.disabled = true;
    clearTimeout(mossProgressTimer);
    el.mossRun.disabled = true;
    el.engine.disabled = true;
    el.control.disabled = true;
    syncEngineCards();
    el.mossProgress.classList.add('visible');
    el.mossStatus.className = 'model-status';
    el.mossStatus.textContent = t().mossUploading;
    setMossProgress(null);

    try {
      let segments = [];
      let rawText = '';

      if (space.mode === 'rest') {
        const res = await fetch(`${space.host}/api/transcribe?name=${encodeURIComponent(file.name)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        segments = parseMossSegments(data.segments);
        rawText = data.rawTraditional || data.raw || '';
      } else {
        const form = new FormData();
        form.append('files', file);
        const upload = await fetch(`${space.host}/gradio_api/upload`, { method: 'POST', body: form });
        if (!upload.ok) throw new Error(`upload HTTP ${upload.status}`);
        const uploaded = await upload.json();
        const path = Array.isArray(uploaded) ? uploaded[0] : uploaded;
        setMossProgress(20);
        el.mossStatus.textContent = t().mossRunning;

        const call = await fetch(`${space.host}/gradio_api/call/${space.apiName}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: [{ path, meta: { _type: 'gradio.FileData' }, orig_name: file.name }, null] })
        });
        if (!call.ok) throw new Error(`call HTTP ${call.status}`);
        const { event_id: eventId } = await call.json();
        setMossProgress(55);

        const stream = await fetch(`${space.host}/gradio_api/call/${space.apiName}/${eventId}`);
        if (!stream.ok || !stream.body) throw new Error(`stream HTTP ${stream.status}`);
        const reader = stream.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (!payload) continue;
            try {
              const parsed = JSON.parse(payload);
              // Gradio 的 data 幀形如 ["<逐字稿>"]；官方 Space 的值就是整份逐字稿字串
              const value = Array.isArray(parsed) ? parsed[0] : parsed;
              if (typeof value === 'string' && value.trim()) rawText = value;
            } catch (error) { /* 心跳或非 JSON 事件，忽略 */ }
          }
        }
        segments = parseMossGradio(rawText);
      }

      setMossProgress(100);
      if (!segments.length) {
        el.mossStatus.className = 'model-status error';
        el.mossStatus.textContent = rawText ? t().mossNoSegments : t().mossEmpty;
        if (rawText) commit(rawText);
        hideMossProgressLater();
        return;
      }

      const seconds = Math.round((Date.now() - startedAt) / 1000);
      commit(`--- MOSS 轉寫：${file.name}（${segments.length} 段，耗時 ${seconds} 秒）---`);
      for (const seg of segments) commit(mossLine(seg));
      moss.segments = segments;
      el.mossSrt.disabled = false;
      el.mossStatus.className = 'model-status success';
      el.mossStatus.textContent = `${t().mossDone}（${segments.length} 段，${seconds} 秒）`;
      showToast(t().mossDone);
      hideMossProgressLater();
    } catch (error) {
      console.warn('MOSS transcription failed:', error);
      el.mossStatus.className = 'model-status error';
      setMossProgress(0);
      el.mossStatus.textContent = `${t().mossFailed}：${error.message}｜${t().mossColdHint}`;
      hideMossProgressLater();
    } finally {
      moss.running = false;
      el.mossRun.disabled = false;
      el.engine.disabled = false;
      updateButtons();
    }
  }

  function setUi(lang) {
    state.ui = lang;
    const d = T[lang];

    el.title.textContent = d.title;

      'voskSourceLabel', 'voskModelLabel', 'voskFileLabel', 'optVoskBuiltin', 'optVoskFile',
      'optVoskUrl', 'sherpaBaseLabel', 'whisperModelLabel', 'vadLabel', 'optVadHigh',
      'optVadMid', 'optVadLow', 'statusEngineLabel', 'statusRuntimeLabel',

    ]) {

    $('howItWorksText').textContent = d.howItWorks;

    updateMossFileText();

    // updateEngine() 內部已呼叫 updateButtons() 與 save()
    updateEngine();
  }

  function save() {
    try {
      localStorage.setItem('stt-pref', JSON.stringify({
        ui: state.ui,
        engine: el.engine.value,
        lang: el.lang.value,
        whisper: el.whisperModel.value,
        sherpaBase: el.sherpaBase.value.trim()
      }));
    } catch {}
  }

  function load() {
    try {
      const p = JSON.parse(localStorage.getItem('stt-pref') || '{}');
      if (p.engine) el.engine.value = p.engine;
      if (p.lang) el.lang.value = p.lang;

      state.ui = p.ui || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en');
    } catch {}
  }

  el.engine.onchange = updateEngine;
  el.engineCards.addEventListener('click', e => {
    const card = e.target.closest('.engine-card');
    if (!card || card.disabled) return;
    el.engine.value = card.dataset.engine;
    updateEngine();
  });
  el.lang.onchange = save;
  el.sherpaBase.onchange = save;
  el.whisperModel.onchange = () => {
    el.whisperStatus.textContent = t().modelChanged;
    el.whisperStatus.className = 'model-status';
    save();
  };
  el.voskLang.onchange = () => {
    vosk.loaded = false;
    el.voskStatus.textContent = t().modelChanged;
    el.voskStatus.className = 'model-status';
  };
  el.voskSource.onchange = () => {
    vosk.loaded = false;
    el.voskStatus.textContent = t().sourceChanged;
    el.voskStatus.className = 'model-status';
    const s = el.voskSource.value;
    el.voskBuiltinRow.hidden = s !== 'builtin';
    el.voskFileRow.hidden = s !== 'file';
    el.voskUrlRow.hidden = s !== 'url';
  };
  el.control.onclick = toggle;
  el.loadVosk.onclick = loadVosk;
  el.loadSherpa.onclick = loadSherpa;
  el.clearSherpaCache.onclick = clearSherpaCache;
  el.loadWhisper.onclick = loadWhisper;
  el.mossRun.onclick = runMoss;
  el.mossSrt.onclick = exportMossSrt;
  el.mossFile.addEventListener('change', updateMossFileText);
  el.mossFileZone.addEventListener('dragover', e => {
    e.preventDefault();
    el.mossFileZone.classList.add('over');
  });
  el.mossFileZone.addEventListener('dragleave', () => el.mossFileZone.classList.remove('over'));
  el.mossFileZone.addEventListener('drop', e => {
    e.preventDefault();
    el.mossFileZone.classList.remove('over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    if (/^(audio|video)\//.test(file.type) || /\.(mp3|wav|m4a|aac|ogg|flac|opus|mp4|mov|mkv|webm|amr|wma)$/i.test(file.name)) {
      const dt = new DataTransfer();
      dt.items.add(file);
      el.mossFile.files = dt.files;
      updateMossFileText();
    } else {
      showToast(t().mossPickFile);
    }
  });
  el.toggle.onclick = () => setUi(state.ui === 'zh' ? 'en' : 'zh');

  el.clear.onclick = () => {
    if (state.running || state.stopping || whisper.drainPromise) return showToast(t().busyClear);

    clearWebRestartTimer();
    removeVoskRecognizer();
    state.segments = [];
    state.interim = '';
    state.start = null;
    state.end = null;
    state.manualStop = false;
    state.webRecognitionActive = false;
    whisper.queue = [];
    whisper.vad = null;
    moss.segments = [];
    el.mossSrt.disabled = true;

    el.placeholder.textContent = t().placeholder;
    setLevel(0);
    render();
    requestAnimationFrame(() => { el.container.scrollTop = 0; });
    updateButtons();
  };

  el.copy.onclick = async () => {
    const transcriptText = getEffectiveTranscriptText('\n');
    if (!transcriptText) return showToast(t().nothingToCopy);
    try {
      await navigator.clipboard.writeText(transcriptText);
      showToast(t().copied);
    } catch (error) {
      console.error('Clipboard write failed:', error);
      showToast(t().copyFailed);
    }
  };

  el.export.onclick = () => {
    const transcriptText = getEffectiveTranscriptText('\r\n');
    if (!transcriptText) return showToast(t().nothingToExport);

    const blob = new Blob(['﻿' + transcriptText], { type: 'text/plain;charset=utf-8' });
    const anchor = document.createElement('a');
    const startedAt = state.start || new Date();
    const objectUrl = URL.createObjectURL(blob);

    anchor.href = objectUrl;
    anchor.download = `transcript_${startedAt.toISOString().slice(0, 10)}_${stamp(startedAt).slice(1, -1).replaceAll(':', '-')}.txt`;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 500);
  };

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      toggle();
    }
  });

  window.addEventListener('beforeunload', event => {
    if (state.running) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  load();
  initWebSpeech();
  setUi(state.ui);
  render();
})();
  </script>
</body>
</html>
